<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 425" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Pirámide de automatización: ERP, MES, SCADA, PLC y sensores y actuadores</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a7a7a"/>
    </marker>
  </defs>

  <!-- Flechas laterales: datos suben, órdenes bajan -->
  <line x1="28" y1="395" x2="28" y2="50" stroke="#7a7a7a" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="20" y="225" font-size="13" fill="#6b6b6b" text-anchor="middle" transform="rotate(-90 20 225)">datos</text>
  <line x1="52" y1="50" x2="52" y2="395" stroke="#7a7a7a" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="66" y="225" font-size="13" fill="#6b6b6b" text-anchor="middle" transform="rotate(-90 66 225)">órdenes</text>

  <!-- Capas de la pirámide -->
  <g stroke="#ffffff" stroke-width="3">
    <polygon points="280,40 420,40 460,112 240,112" fill="#C3BBE0"/>
    <polygon points="240,112 460,112 500,184 200,184" fill="#BCD8DE"/>
    <polygon points="200,184 500,184 540,256 160,256" fill="#BEE0CF"/>
    <polygon points="160,256 540,256 580,328 120,328" fill="#CFE8D6"/>
    <polygon points="120,328 580,328 620,400 80,400" fill="#E1F0DC"/>
  </g>
  <g font-size="18" font-weight="700" fill="#2f2f2f" text-anchor="middle">
    <text x="350" y="82">ERP</text>
    <text x="350" y="154">MES</text>
    <text x="350" y="226">SCADA</text>
    <text x="350" y="298">PLC</text>
    <text x="350" y="370">Sensores y actuadores</text>
  </g>

  <!-- Corchetes IT / OT -->
  <g stroke-width="3" fill="none">
    <path d="M640,46 h10 v60 h-10" stroke="#59457A"/>
    <path d="M640,118 h10 v60 h-10" stroke="#4A7E90"/>
    <path d="M640,190 h10 v204 h-10" stroke="#3E8A6E"/>
  </g>
  <g font-size="15" font-weight="700">
    <text x="662" y="81" fill="#59457A">IT</text>
    <text x="662" y="153" fill="#4A7E90">IT + OT</text>
    <text x="662" y="297" fill="#3E8A6E">OT</text>
  </g>

  <!-- Descripciones -->
  <g font-size="14" fill="#555555">
    <text x="740" y="76">Gestiona la empresa: pedidos,</text>
    <text x="740" y="94">compras, facturación, almacén</text>
    <text x="740" y="148">Organiza y registra</text>
    <text x="740" y="166">lo que se fabrica</text>
    <text x="740" y="220">Supervisa la planta</text>
    <text x="740" y="238">desde pantallas</text>
    <text x="740" y="297">Controla máquinas y líneas</text>
    <text x="740" y="362">Miden y actúan sobre</text>
    <text x="740" y="380">el proceso físico</text>
  </g>
</svg>
